<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>·</title>
<style>
@font-face { font-family: "Ibarra"; src: url("letras/ibarra-real-nova-latin-400-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; font-display: block; }
@font-face { font-family: "Ibarra"; src: url("letras/ibarra-real-nova-latin-400-normal.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: block; }
@font-face { font-family: "Ysabeau"; src: url("letras/ysabeau-latin-wght-normal.woff2") format("woff2"); font-style: normal; font-weight: 1 1000; font-display: block; }
:root { --cal: #F3F0E7; --cal-clara: #FBFAF6; --ceu: #CFE0EA; --turquesa: #09BAB0; --agua: #0E6F78; --fundo: #0F3B46; --noite: #0B2C35; --tinta: #1B1A17; --tinta-suave: rgba(27, 26, 23, .58); --areia: #DCCFB2; --margem: 22px; }
@supports (color: color(display-p3 0 0 0)) { :root { --turquesa: color(display-p3 .16 .72 .69); } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--cal); color: var(--tinta); font-family: "Ysabeau", system-ui, sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
.etiqueta { font-size: 11.5px; font-weight: 560; letter-spacing: .24em; text-transform: uppercase; }
.fina { font-size: 15px; font-variant-numeric: oldstyle-nums; letter-spacing: .01em; color: var(--tinta-suave); }
.horizonte { display: block; overflow: visible; }
.horizonte path { fill: none; stroke: var(--tinta); stroke-width: 1.15; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sol circle { fill: none; stroke: var(--tinta); stroke-width: 1.15; vector-effect: non-scaling-stroke; }
html, body { height: 100%; }
body { overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.tudo { height: 100%; display: grid; grid-template-rows: minmax(120px, 1fr) auto auto auto; padding: max(env(safe-area-inset-top), 20px) var(--margem) max(env(safe-area-inset-bottom), 14px); transition: opacity .9s ease; }
.tudo.abre { opacity: 0; }
/* O céu acaba no horizonte: quando o código está certo, o sol desce e desaparece atrás dele. */
.ceu { position: relative; overflow: hidden; margin: 0 calc(-1 * var(--margem)); }
.ceu .sol { position: absolute; right: 21%; bottom: 46px; width: 27px; height: 27px; transition: transform 1.5s cubic-bezier(.5, 0, .6, 1); }
.pensa .sol { animation: pensa 1.1s ease-in-out infinite alternate; }
@keyframes pensa { to { transform: translateY(5px); } }
.certo .sol { animation: none; transform: translateY(96px); }
.entrada-horizonte { width: calc(100% + 2 * var(--margem)); margin: -14px calc(-1 * var(--margem)) 0; height: 28px; }
.marcas { display: flex; justify-content: center; gap: 15px; padding: 16px 0 20px; }
.marcas i { width: 9px; height: 9px; border-radius: 50%; border: 1.15px solid var(--tinta); opacity: .55; transition: background .15s ease, opacity .15s ease; }
.marcas i.cheia { background: var(--tinta); opacity: .9; }
.teclas { display: grid; grid-template-columns: repeat(3, 84px); justify-content: center; gap: 4px 20px; }
.seixo { position: relative; width: 84px; height: 71px; padding: 0; border: 0; background: none; color: var(--tinta); font: italic 400 30px/1 "Ibarra", Georgia, serif; cursor: pointer; transition: transform .12s ease; }
.seixo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.seixo span { position: relative; top: -2px; }
.seixo:active, .seixo.toque { transform: translateY(1.5px) scale(.95); }
.apagar { border: 0; background: none; color: var(--tinta-suave); font: inherit; padding: 0; cursor: pointer; }
.fundo-da-entrada { display: flex; justify-content: center; min-height: 44px; align-items: center; margin-top: 6px; }
.outra { border: 0; background: none; padding: 10px; color: var(--tinta-suave); font: 400 14px/1 "Ysabeau", sans-serif; letter-spacing: .01em; text-decoration: underline; text-decoration-thickness: .5px; text-underline-offset: 4px; cursor: pointer; }
.codigo { display: none; gap: 10px; align-items: baseline; }
.com-codigo .outra { display: none; }
.com-codigo .codigo { display: flex; }
.codigo input { width: 214px; border: 0; border-bottom: 1.15px solid var(--tinta); border-radius: 0; background: none; padding: 6px 2px; color: var(--tinta); font: 400 16px/1.2 "Ysabeau", sans-serif; letter-spacing: .12em; text-transform: uppercase; outline: none; -webkit-user-select: text; user-select: text; }
.codigo button { border: 0; background: none; padding: 8px 4px; color: var(--tinta); font: 560 11.5px/1 "Ysabeau", sans-serif; letter-spacing: .24em; text-transform: uppercase; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .pensa .sol { animation: none; } .ceu .sol { transition: opacity .6s ease; } .certo .sol { transform: none; opacity: 0; } }

/* PROVA B: o portão, entre dois muros, com o horizonte e o sol por trás */
.ceu .sol { right: auto; left: calc(50% - 13.5px); bottom: 100px; }
.certo .sol { transform: translateY(150px); transition: transform 1.9s cubic-bezier(.5, 0, .6, 1) .5s; }
.portao { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: auto; display: block; overflow: visible; pointer-events: none; }
.portao .folha { transform-box: view-box; transition: transform 1.5s cubic-bezier(.3, .1, .2, 1); }
.portao .folha-esq { transform-origin: 206px 292px; }
.portao .folha-dir { transform-origin: 694px 292px; }
.portao .argola { transition: opacity .25s ease; }
.certo .portao .argola { opacity: 0; }
.certo .portao .folha-esq { transform: skewY(-11deg) scaleX(0.17); }
.certo .portao .folha-dir { transform: skewY(11deg) scaleX(0.17); }
.abana .portao .folha-esq { animation: abana-esq .95s cubic-bezier(.3, .6, .3, 1); }
.abana .portao .folha-dir { animation: abana-dir .95s cubic-bezier(.3, .6, .3, 1); }
.abana .portao .argola { animation: abana-argola .95s ease-out; }
@keyframes abana-esq { 0% { transform: skewY(0.00deg) scaleX(1); } 11% { transform: skewY(-3.40deg) scaleX(0.955); } 24% { transform: skewY(1.70deg) scaleX(1); } 38% { transform: skewY(-2.70deg) scaleX(0.965); } 52% { transform: skewY(1.20deg) scaleX(1); } 66% { transform: skewY(-1.70deg) scaleX(0.98); } 82% { transform: skewY(0.60deg) scaleX(1); } 100% { transform: skewY(0.00deg) scaleX(1); } }
@keyframes abana-dir { 0% { transform: skewY(0.00deg) scaleX(1); } 11% { transform: skewY(3.40deg) scaleX(0.955); } 24% { transform: skewY(-1.70deg) scaleX(1); } 38% { transform: skewY(2.70deg) scaleX(0.965); } 52% { transform: skewY(-1.20deg) scaleX(1); } 66% { transform: skewY(1.70deg) scaleX(0.98); } 82% { transform: skewY(-0.60deg) scaleX(1); } 100% { transform: skewY(0.00deg) scaleX(1); } }
@keyframes abana-argola { 0%, 100% { transform: none; } 11% { transform: translate(-2px, -13px); } 24% { transform: translate(1.5px, 6px); } 38% { transform: translate(-1.5px, -10px); } 52% { transform: translate(1px, 4px); } 66% { transform: translate(-.8px, -6px); } 82% { transform: translate(0, 2px); } }
.calmo .portao .folha, .calmo .portao .argola { transition: none; animation: none; }
.calmo .certo .sol { transition: opacity .6s ease; transform: none; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .portao .folha, .portao .argola { transition: none; animation: none; } .certo .sol { transform: none; transition: opacity .6s ease; opacity: 0; } }
</style>
